<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SmartExtract turns unstructured invoices and resumes into validated, structured data."
    />
    <meta name="theme-color" content="#11142b" />
    <title>SmartExtract — Structured data, without the busywork</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="auth-root"></div>
    <div id="app-root" class="app-root" hidden>
      <div class="mobile-scrim" data-action="close-nav"></div>
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="/" data-page="dashboard" aria-label="SmartExtract home">
          <span class="brand-mark">S</span>
          <span class="brand-copy">
            <strong>SmartExtract</strong>
            <small>Structured AI workspace</small>
          </span>
        </a>

        <div class="workspace-label">WORKSPACE</div>
        <nav class="side-nav" aria-label="Main navigation">
          <button class="nav-link" data-page="dashboard">
            <span class="nav-icon" data-icon="grid"></span><span>Overview</span>
          </button>
          <button class="nav-link" data-page="invoice">
            <span class="nav-icon" data-icon="receipt"></span><span>Invoice extraction</span>
          </button>
          <button class="nav-link" data-page="resume">
            <span class="nav-icon" data-icon="file-user"></span><span>Resume extraction</span>
          </button>
          <button class="nav-link" data-page="history">
            <span class="nav-icon" data-icon="clock"></span><span>Extraction history</span>
          </button>
        </nav>

        <div class="sidebar-spacer"></div>
        <div class="sidebar-note">
          <span class="note-icon" data-icon="shield"></span>
          <div>
            <strong>Your data, structured.</strong>
            <p>Validated with your project’s Pydantic schemas.</p>
          </div>
        </div>
        <button class="nav-link settings-link" data-page="settings">
          <span class="nav-icon" data-icon="settings"></span><span>Settings</span>
        </button>
        <div class="sidebar-user" id="sidebar-user"></div>
      </aside>

      <div class="main-shell">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-button mobile-menu" data-action="toggle-nav" aria-label="Open navigation">
              <span data-icon="menu"></span>
            </button>
            <div class="breadcrumb"><span>Workspace</span><span class="crumb-divider">/</span><strong id="page-title">Overview</strong></div>
          </div>
          <div class="topbar-right">
            <span class="connection-pill">            <span class="connection-dot"></span> Secure API workspace</span>
            <button class="topbar-avatar" data-page="settings" aria-label="Open settings" id="topbar-avatar">S</button>
          </div>
        </header>
        <main class="page-content" id="page-content" tabindex="-1"></main>
      </div>
    </div>
  </body>
</html>
